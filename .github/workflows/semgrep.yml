name: semgrep

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --error
